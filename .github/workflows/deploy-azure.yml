# OIDC (user-assigned MI) deploy Bicep, dotnet test, then optionally build/push Api+McpServer to ACR and update Container Apps.
#
# deployment_scope: resource-group | subscription (see previous docs).
# push_app_images: after successful job steps before this one, build/push api + mcpserver (tag = commit SHA) and az containerapp update.

name: Deploy Azure (Bicep + build)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment name (must match federated credential subject)
        required: true
        type: choice
        options:
          - dev
          - prod
      deployment_scope:
        description: |
          subscription = full stack + create/update resource group (needs subscription-level RBAC on MI).
          resource-group = deploy into existing RG only (MI Contributor on that RG).
        required: true
        type: choice
        default: resource-group
        options:
          - resource-group
          - subscription
      push_app_images:
        description: After deploy, build/push Api + McpServer Docker images to ACR and update Container App revisions
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG_NAME: rg-ai-mcp-server-demo-${{ inputs.environment }}
      DEPLOYMENT_NAME: gha-${{ github.run_id }}
      AZURE_DEPLOYMENT_REGION: australiaeast
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure session
        run: az account show

      - name: Ensure Azure Bicep CLI
        run: az bicep version || az bicep install

      - name: Deploy Bicep (resource group — main.bicep)
        if: inputs.deployment_scope == 'resource-group'
        run: |
          set -euo pipefail
          az deployment group create \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group "${{ env.RG_NAME }}" \
            --template-file infra/bicep/main.bicep \
            --parameters "infra/bicep/parameters/main.${{ inputs.environment }}.bicepparam"

      - name: Debug Azure deployment (resource group, on failure)
        if: failure() && inputs.deployment_scope == 'resource-group'
        run: |
          set +e
          echo "::group::Root deployment failed operations"
          az deployment operation group list \
            --resource-group "${{ env.RG_NAME }}" \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --query "[?properties.provisioningState=='Failed']" -o json
          echo "::endgroup::"
          echo "::group::Nested deployment acr failed operations"
          az deployment operation group list \
            --resource-group "${{ env.RG_NAME }}" \
            --name "acr" \
            --query "[?properties.provisioningState=='Failed']" -o json 2>/dev/null || echo "(could not list nested deployment acr)"
          echo "::endgroup::"

      - name: Deploy Bicep (subscription — subscription.bicep, full stack)
        if: inputs.deployment_scope == 'subscription'
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --location "${{ env.AZURE_DEPLOYMENT_REGION }}" \
            --template-file infra/bicep/subscription.bicep \
            --parameters "infra/bicep/parameters/subscription.${{ inputs.environment }}.bicepparam"

      - name: Show deployment outputs (resource group)
        if: inputs.deployment_scope == 'resource-group'
        run: |
          az deployment group show \
            --resource-group "${{ env.RG_NAME }}" \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --query properties.outputs \
            -o json

      - name: Show deployment outputs (subscription)
        if: inputs.deployment_scope == 'subscription'
        run: |
          az deployment sub show \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --query properties.outputs \
            -o json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
          global-json-file: global.json

      - name: Restore, build, test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --verbosity minimal

      - name: Ensure Container Apps extension
        if: inputs.push_app_images
        run: az extension add --name containerapp --upgrade -y 2>/dev/null || true

      - name: Build and push images to ACR, update Container Apps
        if: inputs.push_app_images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACR_NAME=$(az acr list -g "${{ env.RG_NAME }}" --query "sort_by([?starts_with(name, 'acrmcp')], &name)[0].name" -o tsv)
          if [ -z "$ACR_NAME" ] || [ "$ACR_NAME" = "null" ]; then
            echo "No ACR named acrmcp* in ${{ env.RG_NAME }}; skip image push."
            exit 0
          fi
          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g "${{ env.RG_NAME }}" --query loginServer -o tsv)
          echo "Using ACR $ACR_NAME ($LOGIN_SERVER), tag $IMAGE_TAG"
          az acr login -n "$ACR_NAME"
          docker build -f docker/Api.Dockerfile -t "${LOGIN_SERVER}/api:${IMAGE_TAG}" .
          docker build -f docker/McpServer.Dockerfile -t "${LOGIN_SERVER}/mcpserver:${IMAGE_TAG}" .
          docker push "${LOGIN_SERVER}/api:${IMAGE_TAG}"
          docker push "${LOGIN_SERVER}/mcpserver:${IMAGE_TAG}"
          az containerapp update -g "${{ env.RG_NAME }}" -n "ca-api-${{ inputs.environment }}" --container-name api --image "${LOGIN_SERVER}/api:${IMAGE_TAG}"
          az containerapp update -g "${{ env.RG_NAME }}" -n "ca-mcp-${{ inputs.environment }}" --container-name mcp --image "${LOGIN_SERVER}/mcpserver:${IMAGE_TAG}"
          echo "Updated Container Apps to ${LOGIN_SERVER}/api:${IMAGE_TAG} and .../mcpserver:${IMAGE_TAG}"

