# OIDC via user-assigned MI → deploy infra/bicep/main.bicep (RG scope), then build/test.
# Requires resource group rg-ai-mcp-server-demo-{env} to exist (one-time subscription.bicep or az group create).
# MI must have Contributor on that RG (Phase 1 Bicep / bootstrap).

name: Deploy Azure (Bicep + build)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment name (must match federated credential subject)
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG_NAME: rg-ai-mcp-server-demo-${{ inputs.environment }}
      DEPLOYMENT_NAME: gha-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure session
        run: az account show

      - name: Ensure Azure Bicep CLI
        run: az bicep version || az bicep install

      - name: Deploy Bicep (resource group)
        run: |
          set -euo pipefail
          az deployment group create \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group "${{ env.RG_NAME }}" \
            --template-file infra/bicep/main.bicep \
            --parameters "infra/bicep/parameters/main.${{ inputs.environment }}.bicepparam"

      - name: Show deployment outputs
        run: |
          az deployment group show \
            --resource-group "${{ env.RG_NAME }}" \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --query properties.outputs \
            -o json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
          global-json-file: global.json

      - name: Restore, build, test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --verbosity minimal
