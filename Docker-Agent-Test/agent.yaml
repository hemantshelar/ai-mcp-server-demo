#!/usr/bin/env docker agent run
# Docker Agent: local LLM (DMR) + remote MCP (this repo's McpServer on Streamable HTTP).
# Prerequisites: see README.md in this folder.

agents:
  root:
    model: local_mcp_demo
    description: >-
      Local model (Docker Model Runner) with MCP tools from ai-mcp-server-demo
      (ping, echo, reverse_string, get_server_info).
    instruction: |
      You are a helpful assistant. You have MCP tools from the project's McpServer.
      When the user asks to reverse a string or name, call the reverse_string tool
      with argument "text" set to the string they gave. Do not reverse text manually
      when they asked to use the tool or to test MCP.
    toolsets:
      - type: mcp
        remote:
          url: "https://ca-mcp-dev.wonderfulbeach-936eba76.australiaeast.azurecontainerapps.io/"
          transport_type: "streamable"
        instruction: |
          Tools include reverse_string (parameter: text), ping, echo, get_server_info.
          Use reverse_string for reversing strings.

models:
  local_mcp_demo:
    provider: dmr
    # Must match a model pulled locally (`docker model list`). Examples from Docker Hub catalog:
    # - ai/gemma2:2b-it-Q4_K_M
    # - ai/qwen2:0.5B-Q4_K_M
    # - ai/deepseek-r1-distill-llama:latest
    # model: ai/qwen3:0.6B-Q4_K_M
    #model: ai/deepseek-r1-distill-llama:latest
    model: docker.io/ai/qwen3-coder:latest
