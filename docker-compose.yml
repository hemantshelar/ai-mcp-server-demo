# Build from repo root: docker compose up --build
# Services listen on 8080 inside the network; host ports match Development HTTP ports.
services:
  api:
    build:
      context: .
      dockerfile: docker/Api.Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  mcp:
    build:
      context: .
      dockerfile: docker/McpServer.Dockerfile
    ports:
      - "5136:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
